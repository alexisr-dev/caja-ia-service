name: Publicar imagen Docker en GHCR

# Construye la imagen del microservicio y la publica en GitHub Container Registry.
# NO se pasan build-args: toda la configuración (IA_SERVICE_API_KEY, umbrales, etc.)
# se inyecta en runtime como variables de entorno, nunca horneada en la imagen.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alexisr-dev/caja-ia-service

# Un push que llega mientras otro build sigue vivo cancela al anterior: la imagen
# :latest debe corresponder siempre al último commit de main.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read # checkout del repo
      packages: write # push del paquete a ghcr.io

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        # models_ia/best.onnx (~9 MB) se versiona como blob normal, no con LFS
        # (ver .gitattributes). Si algún día se migra el modelo a LFS, hay que
        # descomentar la línea siguiente o el checkout dejará un puntero de texto
        # en lugar del modelo y la imagen se construirá rota.
        # with:
        #   lfs: true

      - name: Calcular SHA corto del commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0
          # Caché de capas en GitHub Actions: evita reinstalar requirements.txt
          # (torch/ultralytics/CLIP tardan varios minutos) cuando sólo cambia el código.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen del despliegue
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
